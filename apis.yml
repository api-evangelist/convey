name: Convey
description: Convey is an enterprise AI platform for building and running autonomous "digital
  teammates" — AI workers that non-technical operators train by describing a workflow or sharing
  their screen, after which the teammate runs business processes end to end across existing
  enterprise systems (Salesforce, NetSuite, ad operations, reporting) with role-based access,
  isolated agent identities, dedicated credentials, audit logs, and escalation to a human on
  high-stakes decisions. Founded by former DoorDash and project44 engineers, Convey raised a $38M
  Series A led by Andreessen Horowitz in June 2026 (with Khosla Ventures and Pear VC) and reports
  1.1M+ hours of work completed for customers including NBCUniversal, TelevisaUnivision, Unity, and
  Samsara. The platform is SOC 2 Type II and HIPAA compliant. Convey is an enterprise, contact-sales
  product with no public developer API or documentation surface as of this profile.
